name: Update profile cards

on:
  schedule:
    - cron: "17 */12 * * *"   # a cada 12 horas
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/stats.mjs"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stats & languages cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/stats.mjs

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#A388FF&color_dots=#161b22,#3b2a73,#5A22E0,#7336FF,#A388FF

      - name: Commit
        run: |
          cp dist/snake.svg assets/snake.svg
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/snake.svg
          git diff --cached --quiet || (git commit -m "chore: update profile cards" && git push)
